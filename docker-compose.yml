version: "3.7"

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: digital_bank
      MYSQL_USER: default_user
      MYSQL_PASSWORD: default_password
    ports:
      - "3307:3306"
    networks:
      - s-network
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - s-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digital_bank
      SPRING_DATASOURCE_USERNAME: default_user
      SPRING_DATASOURCE_PASSWORD: default_password

networks:
  s-network:
    driver: bridge

volumes:
  mysql-data: